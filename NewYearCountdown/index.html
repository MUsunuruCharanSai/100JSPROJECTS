<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Countdown</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">

        <h1>New Year Countdown 🎉</h1>

        <div class="countdown">

            <div class="time-box">
                <span id="day">0</span>
                <p>Days</p>
            </div>

            <div class="time-box">
                <span id="hour">0</span>
                <p>Hours</p>
            </div>

            <div class="time-box">
                <span id="minute">0</span>
                <p>Minutes</p>
            </div>

            <div class="time-box">
                <span id="second">0</span>
                <p>Seconds</p>
            </div>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
