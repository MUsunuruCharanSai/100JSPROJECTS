<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <div class="container">

    <textarea id="textarea" maxlength="200"></textarea>

    <div class="counter">
      <span>Total: <span id="total-counter">0</span></span>
      <span>Remaining: <span id="remaining-counter">200</span></span>
    </div>

  </div>

  <script src="index.js"></script>

</body>
</html>
