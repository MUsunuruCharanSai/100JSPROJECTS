<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 40px;
        }

        #cart-button {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 35px;
            transition: .3s;
        }

        #cart-button:hover {
            background: #1d4ed8;
        }

        #product {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        #sub-product {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: .3s;
        }

        #sub-product:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, .15);
        }

        #sub-product img {
            width: 100%;
            max-width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }

        #sub-product h2 {
            margin: 18px 0 10px;
            font-size: 22px;
            color: #222;
        }

        #sub-product h3 {
            color: #2563eb;
            font-size: 26px;
            margin-bottom: 20px;
        }

        #sub-product button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        #sub-product button:hover {
            background: #1d4ed8;
        }

        #sub-product button:active {
            transform: scale(.97);
        }
    </style>
</head>

<body>
    <a id="cart-button" href="addCart.html">ADDED TO CART(<span id="cart-count">0</span>)</a>
    <div id="product">

    </div>
    <script src="cart.js"></script>
</body>

</html>
