<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="main-progress">

        <div class="step">
            <div class="sub"></div>
            <span class="hide">Start</span>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="sub"></div>
            <span class="hide">Step 1</span>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="sub"></div>
            <span class="hide">Step 2</span>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="sub"></div>
            <span class="hide">Step 3</span>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="sub"></div>
            <span class="hide">End</span>
        </div>

    </div>
    <div class="buttons">
        <button id="prev">Previous</button>
        <button id="next">Next</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
