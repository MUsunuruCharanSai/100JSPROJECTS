<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>💰 Tip Calculator</h1>

        <label>Bill Amount (₹)</label>
        <input type="number" id="bill" placeholder="Enter bill amount">

        <label>Tip Percentage (%)</label>
        <input type="number" id="tip" placeholder="Enter tip percentage">

        <label>Number of People</label>
        <input type="number" id="people" placeholder="Enter number of people">

        <button onclick="calculateTip()">Calculate</button>

        <div class="result">
            <p>Total Tip: ₹ <span id="totalTip">0.00</span></p>
            <p>Total Amount: ₹ <span id="totalAmount">0.00</span></p>
            <p>Per Person: ₹ <span id="perPerson">0.00</span></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
