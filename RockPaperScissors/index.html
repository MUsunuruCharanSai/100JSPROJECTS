<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">

        <h1>Rock Paper Scissors</h1>

        <div class="main">
            <div id="rock" class="a">Rock</div>
            <div id="paper" class="a">Paper</div>
            <div id="scissors" class="a">Scissors</div>
        </div>

        <div id="result">Choose Rock, Paper, or Scissors</div>

        <div class="score-board">
            <div id="users-score">User Score : 0</div>
            <div id="system-score">System Score : 0</div>
        </div>

        <button id="reset">Reset Score</button>

    </div>
    <script src="index.js"></script>
</body>

</html>
