
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionary App</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <h1>📖 Dictionary</h1>
    <p class="subtitle">Find the meaning of a word</p>

    <form id="searchForm">
      <input id="wordInput" placeholder="Enter a word" value="happy" required>
      <button type="submit">Search</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
