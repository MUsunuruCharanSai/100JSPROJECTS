<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="calculator">
            <h1>Compound Interest Calculator</h1>
            <p class="subtitle">Calculate how your money grows over time.</p>

            <div class="form-group">
                <label for="principal">Principal Amount (₹)</label>
                <input 
                    type="number" 
                    id="principal" 
                    placeholder="Enter principal amount"
                    min="0"
                >
            </div>

            <div class="form-group">
                <label for="rate">Annual Interest Rate (%)</label>
                <input 
                    type="number" 
                    id="rate" 
                    placeholder="Enter interest rate"
                    min="0"
                    step="0.01"
                >
            </div>

            <div class="form-group">
                <label for="time">Time (Years)</label>
                <input 
                    type="number" 
                    id="time" 
                    placeholder="Enter number of years"
                    min="0"
                    step="0.1"
                >
            </div>

            <div class="form-group">
                <label for="frequency">Compounding Frequency</label>
                <select id="frequency">
                    <option value="1">Annually</option>
                    <option value="2">Half-Yearly</option>
                    <option value="4">Quarterly</option>
                    <option value="12" selected>Monthly</option>
                    <option value="365">Daily</option>
                </select>
            </div>

            <button id="calculateBtn">Calculate</button>

            <button id="resetBtn" class="reset-btn">Reset</button>

            <div id="error" class="error"></div>

            <div class="result" id="result">
                <div class="result-box">
                    <span>Principal Amount</span>
                    <strong id="principalResult">₹0</strong>
                </div>

                <div class="result-box">
                    <span>Total Interest</span>
                    <strong id="interestResult">₹0</strong>
                </div>

                <div class="result-box total">
                    <span>Final Amount</span>
                    <strong id="finalResult">₹0</strong>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
