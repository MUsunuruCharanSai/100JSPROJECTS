
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Ordering Bot</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="chat-container">
    <h2>🍔 Food Bot</h2>

  </div>

  <script src="index.js"></script>
</body>
</html>
