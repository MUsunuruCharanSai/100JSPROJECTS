<!DOCTYPE html>
<html>
<head>
    <title>Search Filter</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>Products</h1>

        <input
            type="text"
            id="search"
            placeholder="Search product..."
            onkeyup="searchProduct()"
        >

        <div id="products">

            <div class="product">
                <h3>iPhone 15</h3>
                <p>₹60,000</p>
            </div>

            <div class="product">
                <h3>Samsung Galaxy</h3>
                <p>₹45,000</p>
            </div>

            <div class="product">
                <h3>OnePlus 13</h3>
                <p>₹55,000</p>
            </div>

            <div class="product">
                <h3>MacBook Air</h3>
                <p>₹90,000</p>
            </div>

            <div class="product">
                <h3>HP Laptop</h3>
                <p>₹60,000</p>
            </div>

        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
