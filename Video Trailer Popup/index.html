
<!DOCTYPE html>
<html>
<head>
    <title>Video Popup</title>
<link rel="stylesheet" href="index.css">
</head>

<body>

    <img src="https://images.pexels.com/photos/3062545/pexels-photo-3062545.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260">

    <h1>Movie Title</h1>

    <p>
        This is a simple movie trailer popup.
    </p>

    <button id="watchBtn">Watch Now</button>

    <div class="trailer" id="trailer">

        <span class="close" id="closeBtn">&times;</span>

        <video id="video" controls>
            <source 
                src="https://www.w3schools.com/html/mov_bbb.mp4"
                type="video/mp4"
            >
        </video>

    </div>
    <script src="index.js"></script>
</body>
</html>
